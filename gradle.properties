# Gradle project-wide settings

# JVM arguments for the daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Run in parallel
org.gradle.parallel=true

# Configure on-demand
org.gradle.configureondemand=true

# Caching
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes (faster builds, smaller APK)
android.nonTransitiveRClass=true

# Disable build features we don't use by default (override per-module)
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
